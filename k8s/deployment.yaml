apiVersion: apps/v1
kind: Deployment
metadata:
  name: french-srs-bot
  namespace: french
spec:
  replicas: 1
  strategy:
    type: Recreate   # never two bots polling the same Telegram token
  selector:
    matchLabels:
      app: french-srs-bot
  template:
    metadata:
      labels:
        app: french-srs-bot
    spec:
      containers:
        - name: bot
          image: ghcr.io/njwgroeneveld/french-srs-bot:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: french-srs-bot-secrets
          env:
            - name: TMPDIR
              value: /tmp
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 20m
              memory: 200Mi
            limits:
              # Measured on this node: 155 MB once the piper voice is loaded, peaking at
              # 309 MB on a long text. Single words stay around 200 MB.
              memory: 512Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
